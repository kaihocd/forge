"$schema" = 'https://starship.rs/config-schema.json'

# Prompt layout
# The top-level format owns spacing; module formats only render their content.
format = """
$directory\
( $git_branch)\
( $git_status)\
( $git_commit)\
( $aws)\
( $azure)\
( $battery)\
( $buf)\
( $bun)\
( $c)\
( $cmake)\
( $cobol)\
( $conda)\
( $container)\
( $cpp)\
( $crystal)\
( $daml)\
( $dart)\
( $deno)\
( $direnv)\
( $docker_context)\
( $dotnet)\
( $elixir)\
( $elm)\
( $erlang)\
( $fennel)\
( $fortran)\
( $fossil_branch)\
( $fossil_metrics)\
( $gcloud)\
( $gleam)\
( $golang)\
( $gradle)\
( $guix_shell)\
( $haskell)\
( $haxe)\
( $helm)\
( $hg_branch)\
( $hostname)\
( $java)\
( $jobs)\
( $julia)\
( $kotlin)\
( $kubernetes)\
( $localip)\
( $lua)\
( $maven)\
( $memory_usage)\
( $meson)\
( $mise)\
( $mojo)\
( $nats)\
( $netns)\
( $nim)\
( $nix_shell)\
( $nodejs)\
( $ocaml)\
( $odin)\
( $opa)\
( $openstack)\
( $os)\
( $package)\
( $perl)\
( $php)\
( $pijul_channel)\
( $pixi)\
( $pulumi)\
( $purescript)\
( $python)\
( $quarto)\
( $raku)\
( $red)\
( $rlang)\
( $ruby)\
( $rust)\
( $scala)\
( $shell)\
( $singularity)\
( $solidity)\
( $spack)\
( $status)\
( $sudo)\
( $swift)\
( $terraform)\
( $time)\
( $typst)\
( $username)\
( $vagrant)\
( $vcsh)\
( $vlang)\
( $xmake)\
( $zig)\
( $cmd_duration)\
$line_break\
$character"""
continuation_prompt = "[.](bright-black) "
add_newline = false

[directory]
format = '[┌\[](bright-black)[$path](bold blue)[\]](bright-black)[$read_only]($read_only_style)'

[character]
success_symbol = '[└\[](bright-black)[I](bold green)[\]](bright-black)[ \$](bold green)'
error_symbol = '[└\[](bright-black)[E](bold red)[\]](bright-black)[ \$](bold red)'
vimcmd_symbol = '[└\[](bright-black)[N](bold blue)[\]](bright-black)[ \$](bold green)'
vimcmd_visual_symbol = '[└\[](bright-black)[V](bold yellow)[\]](bright-black)[ \$](bold yellow)'
vimcmd_replace_symbol = '[└\[](bright-black)[R](bold purple)[\]](bright-black)[ \$](bold purple)'
vimcmd_replace_one_symbol = '[└\[](bright-black)[R](bold purple)[\]](bright-black)[ \$](bold purple)'

# Git
[git_branch]
format = '[\[$branch\]]($style)'
truncation_symbol = "..."

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
renamed = "Ʀ"
ahead = "↑"
behind = "↓"
deleted = "✗"
diverged = "↯"

[git_commit]
format = '[\($hash$tag\)]($style)'
tag_symbol = " tag "

# Modules (alphabetical)
[aws]
format = '[\[$symbol($profile)(\($region\))(\[$duration\])\]]($style)'
symbol = "aws "

[azure]
format = '[\[$symbol($subscription)\]]($style)'
symbol = "az "

[battery]
format = '[\[$symbol$percentage\]]($style)'
full_symbol = "full "
charging_symbol = "charging "
discharging_symbol = "discharging "
unknown_symbol = "unknown "
empty_symbol = "empty "

[buf]
format = '[\[$symbol($version)\]]($style)'
symbol = "buf "

[bun]
format = '[\[$symbol($version)\]]($style)'
symbol = "bun "

[c]
format = '[\[$symbol($version(-$name))\]]($style)'
symbol = "C "

[cmake]
format = '[\[$symbol($version)\]]($style)'
symbol = "cmake "

[cmd_duration]
format = '[\[took $duration\]]($style)'

[cobol]
format = '[\[$symbol($version)\]]($style)'
symbol = "cobol "

[conda]
format = '[\[$symbol$environment\]]($style)'
symbol = "conda "

[container]
format = '[\[$symbol \[$name\]\]]($style)'
symbol = "container "

[cpp]
format = '[\[$symbol($version(-$name))\]]($style)'
symbol = "C++ "

[crystal]
format = '[\[$symbol($version)\]]($style)'
symbol = "cr "

[daml]
format = '[\[$symbol($version)\]]($style)'
symbol = "daml "

[dart]
format = '[\[$symbol($version)\]]($style)'
symbol = "dart "

[deno]
format = '[\[$symbol($version)\]]($style)'
symbol = "deno "

[direnv]
format = '[\[$symbol$loaded/$allowed\]]($style)'

[docker_context]
format = '[\[$symbol$context\]]($style)'
symbol = "docker "

[dotnet]
format = '[\[$symbol($version)(target $tfm)\]]($style)'
symbol = ".NET "

[elixir]
format = '[\[$symbol($version \(OTP $otp_version\))\]]($style)'
symbol = "exs "

[elm]
format = '[\[$symbol($version)\]]($style)'
symbol = "elm "

[erlang]
format = '[\[$symbol($version)\]]($style)'
symbol = "erl "

[fennel]
format = '[\[$symbol($version)\]]($style)'
symbol = "fnl "

[fortran]
format = '[\[$symbol($version)\]]($style)'
symbol = "fortran "

[fossil_branch]
format = '[\[$symbol$branch\]]($style)'
symbol = "fossil "

[fossil_metrics]
format = '[\[+$added\]]($added_style)[\[-$deleted\]]($deleted_style)'

[gcloud]
format = '[\[$symbol$account(@$domain)(\($region\))\]]($style)'
symbol = "gcp "

[gleam]
format = '[\[$symbol($version)\]]($style)'
symbol = "gleam "

[golang]
format = '[\[$symbol($version)\]]($style)'
symbol = "go "

[gradle]
format = '[\[$symbol($version)\]]($style)'
symbol = "gradle "

[guix_shell]
format = '[\[$symbol\]]($style)'
symbol = "guix "

[haskell]
format = '[\[$symbol($version)\]]($style)'
symbol = "haskell "

[haxe]
format = '[\[$symbol($version)\]]($style)'
symbol = "hx "

[helm]
format = '[\[$symbol($version)\]]($style)'
symbol = "helm "

[hg_branch]
format = '[\[$symbol$branch\]]($style)'
symbol = "hg "

[hostname]
format = '[\[$ssh_symbol($hostname)\]]($style)'
ssh_symbol = "ssh "

[java]
format = '[\[$symbol($version)\]]($style)'
symbol = "java "

[jobs]
format = '[\[$symbol$number\]]($style)'
symbol = "*"

[julia]
format = '[\[$symbol($version)\]]($style)'
symbol = "jl "

[kotlin]
format = '[\[$symbol($version)\]]($style)'
symbol = "kt "

[kubernetes]
format = '[\[$symbol$context( \($namespace\))\]]($style)'
symbol = "kubernetes "

[localip]
format = '[\[$localipv4\]]($style)'

[lua]
format = '[\[$symbol($version)\]]($style)'
symbol = "lua "

[maven]
format = '[\[$symbol($version)\]]($style)'
symbol = "maven "

[memory_usage]
format = '[\[$symbol$ram( | $swap)\]]($style)'
symbol = "memory "

[meson]
format = '[\[$symbol$project\]]($style)'
symbol = "meson "

[mise]
format = '[\[$symbol$health\]]($style)'
symbol = "mise "

[mojo]
format = '[\[$symbol($version)\]]($style)'
symbol = "mojo "

[nats]
format = '[\[$symbol$name\]]($style)'
symbol = "nats "

[netns]
format = '[\[$symbol \[$name\]\]]($style)'
symbol = "netns "

[nim]
format = '[\[$symbol($version)\]]($style)'
symbol = "nim "

[nix_shell]
format = '[\[$symbol$state( \($name\))\]]($style)'
symbol = "nix "

[nodejs]
format = '[\[$symbol($version)\]]($style)'
symbol = "nodejs "

[ocaml]
format = '[\[$symbol($version)(\($switch_indicator$switch_name\))\]]($style)'
symbol = "ml "

[odin]
format = '[\[$symbol($version )\]]($style)'
symbol = "odin "

[opa]
format = '[\[$symbol($version)\]]($style)'
symbol = "opa "

[openstack]
format = '[\[$symbol$cloud(\($project\))\]]($style)'
symbol = "openstack "

[os]
format = '[\[$symbol\]]($style)'

[package]
format = '[\[$symbol$version\]]($style)'
symbol = "pkg "

[perl]
format = '[\[$symbol($version)\]]($style)'
symbol = "pl "

[php]
format = '[\[$symbol($version)\]]($style)'
symbol = "php "

[pijul_channel]
format = '[\[$symbol$channel\]]($style)'
symbol = "pijul "

[pixi]
format = '[\[$symbol$version( $environment)\]]($style)'
symbol = "pixi "

[pulumi]
format = '[\[$symbol$stack\]]($style)'
symbol = "pulumi "

[purescript]
format = '[\[$symbol($version)\]]($style)'
symbol = "purs "

[python]
format = '[\[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))\]]($style)'
symbol = "py "

[quarto]
format = '[\[$symbol($version)\]]($style)'
symbol = "quarto "

[raku]
format = '[\[$symbol($version-$vm_version)\]]($style)'
symbol = "raku "

[red]
format = '[\[$symbol($version)\]]($style)'
symbol = "red "

[rlang]
format = '[\[$symbol($version)\]]($style)'
symbol = "r "

[ruby]
format = '[\[$symbol($version)\]]($style)'
symbol = "rb "

[rust]
format = '[\[$symbol($version)\]]($style)'
symbol = "rs "

[scala]
format = '[\[$symbol($version)\]]($style)'
symbol = "scala "

[shell]
format = '[\[$indicator\]]($style)'

[singularity]
format = '[\[$symbol\[$env\]\]]($style)'

[solidity]
format = '[\[$symbol($version)\]]($style)'

[spack]
format = '[\[$symbol$environment\]]($style)'
symbol = "spack "

[status]
format = '[\[$symbol$status\]]($style)'
symbol = "[x](bold red) "
not_executable_symbol = "noexec"
not_found_symbol = "notfound"
sigint_symbol = "sigint"
signal_symbol = "sig"

[sudo]
format = '[\[as $symbol\]]($style)'
symbol = "sudo "

[swift]
format = '[\[$symbol($version)\]]($style)'
symbol = "swift "

[terraform]
format = '[\[$symbol$workspace\]]($style)'

[time]
format = '[\[$time\]]($style)'

[typst]
format = '[\[$symbol($version)\]]($style)'
symbol = "typst "

[username]
format = '[\[$user\]]($style)'

[vagrant]
format = '[\[$symbol($version)\]]($style)'
symbol = "vagrant "

[vcsh]
format = '[\[vcsh $symbol$repo\]]($style)'

[vlang]
format = '[\[$symbol($version)\]]($style)'

[xmake]
format = '[\[$symbol($version)\]]($style)'
symbol = "xmake "

[zig]
format = '[\[$symbol($version)\]]($style)'
symbol = "zig "
