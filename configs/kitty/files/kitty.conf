font_size 12.0
modify_font cell_height 135%

enabled_layouts splits,stack
window_padding_width 0 4
placement_strategy center
confirm_os_window_close -1

cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 10

cursor_trail 3
cursor_trail_decay 0.05 0.10
cursor_trail_start_threshold 2
cursor_trail_color none

repaint_delay 6

shell_integration enabled no-cursor

tab_bar_edge top
tab_bar_style separator
tab_bar_align start
tab_bar_show_new_tab_button yes
tab_separator ""
tab_title_template "{custom}"
active_tab_font_style normal
inactive_tab_font_style normal

macos_option_as_alt no
macos_titlebar_color background

auto_reload_config 0.2
watcher state_watcher.py
geninclude dynamic.py

map_timeout 1.5

# Leader: Shift+Space
map shift+space>y show_scrollback
map shift+space>f search_scrollback
map shift+space>c close_window_with_confirmation
map shift+space>v launch --location=vsplit --bias=50 --cwd=current
map shift+space>s launch --location=hsplit --bias=50 --cwd=current
map shift+space>z toggle_layout stack

map shift+space>h neighboring_window left
map shift+space>j neighboring_window bottom
map shift+space>k neighboring_window top
map shift+space>l neighboring_window right

map --new-mode resize --timeout 1.0 ctrl+shift+f24
map --mode resize shift+h resize_window narrower 3
map --mode resize shift+j resize_window taller 3
map --mode resize shift+k resize_window shorter 3
map --mode resize shift+l resize_window wider 3
map --mode resize esc pop_keyboard_mode

map shift+space>shift+h combine : resize_window narrower 3 : push_keyboard_mode resize
map shift+space>shift+j combine : resize_window taller 3 : push_keyboard_mode resize
map shift+space>shift+k combine : resize_window shorter 3 : push_keyboard_mode resize
map shift+space>shift+l combine : resize_window wider 3 : push_keyboard_mode resize

map shift+space>shift+f kitten font_picker.py

map shift+space>t launch --type=tab --cwd=current
map shift+space>[ previous_tab
map shift+space>] next_tab
map shift+space>left move_tab_backward
map shift+space>right move_tab_forward

map shift+space>1 goto_tab 1
map shift+space>2 goto_tab 2
map shift+space>3 goto_tab 3
map shift+space>4 goto_tab 4
map shift+space>5 goto_tab 5
map shift+space>6 goto_tab 6
map shift+space>7 goto_tab 7
map shift+space>8 goto_tab 8
map shift+space>9 goto_tab 9
map shift+space>0 goto_tab 10
map shift+space>shift+1 goto_tab 11
map shift+space>shift+2 goto_tab 12
map shift+space>shift+3 goto_tab 13
map shift+space>shift+4 goto_tab 14
map shift+space>shift+5 goto_tab 15
map shift+space>shift+6 goto_tab 16
map shift+space>shift+7 goto_tab 17
map shift+space>shift+8 goto_tab 18
map shift+space>shift+9 goto_tab 19
map shift+space>shift+0 goto_tab 20

# Match the portable Alt+direction mappings used by terminal applications.
map super+h send_key alt+h
map super+j send_key alt+j
map super+k send_key alt+k
map super+l send_key alt+l
