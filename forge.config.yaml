# Forge-wide orchestration configuration.
#
# brew installs Homebrew taps, formulae, and casks. `pnpm brew` is idempotent:
# already-installed entries are skipped, missing entries are installed.
#
# modules explicitly enables configuration domains. Workspace packages own
# their own build and deployment lifecycle.

brew:
  taps:
    - gromgit/fuse
  formulas:
    - starship
    - zinit
    - zoxide
    - bat
    - fd
    - fzf
    - ripgrep
    - luajit
    - nvm
    - neovim
  casks:
    - macfuse
    - sshfs-mac
    - font-fira-code-nerd-font
    - font-jetbrains-mono-nerd-font

modules:
  - name: '@forge/starship'
    type: package
  - name: '@forge/state'
    type: package
  - name: '@forge/swatch'
    type: package
  - name: '@forge/wezterm'
    type: package
  - name: '@forge/zsh'
    type: package
